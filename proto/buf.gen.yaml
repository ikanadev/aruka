version: v2
plugins:
  - local: protoc-gen-go
    out: ../arukabe/gen/connect
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../arukabe/gen/connect
    opt: paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: arukabe/gen/connect
