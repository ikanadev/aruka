version: v2
plugins:
  - local: protoc-gen-go
    out: ../arukabe/gen/connect/aruka
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../arukabe/gen/connect/aruka
    opt:
      - paths=source_relative
      - simple
  - local: protoc-gen-es
    out: ../arukaweb/src/connect/arukabe
    include_imports: true
    opt: target=ts
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: arukabe/gen/connect/aruka
