syntax = "proto3";

package chat.v1;

import "models/v1/chat.proto";

message EditChatRequest {
  // Optional for better validation
  optional string chat_id = 1;
  optional string title = 2;
  optional string prompt = 3;
  optional bool pinned = 4;
}

message EditChatResponse {
  models.v1.Chat chat = 1;
}
