version: "2"
sql:
  - engine: "postgresql"
    schema: "./migrations"
    queries:
      - "./core/provider/queries"
      - "./core/chat/queries"
    gen:
      go:
        package: "sqlc"
        out: "gen/sqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
